[workspace]
members = ["host", "test_provider"]
default-members = ["host"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
seatline-companion = { git = "https://github.com/davletovb/seatline", rev = "0cb105e4c4d753abf8fb305d8ccedeeb64dd0ef4", default-features = false }
seatline-core = { git = "https://github.com/davletovb/seatline", rev = "0cb105e4c4d753abf8fb305d8ccedeeb64dd0ef4" }
seatline-platform = { git = "https://github.com/davletovb/seatline", rev = "0cb105e4c4d753abf8fb305d8ccedeeb64dd0ef4" }
seatline-providers = { git = "https://github.com/davletovb/seatline", rev = "0cb105e4c4d753abf8fb305d8ccedeeb64dd0ef4" }
seatline-scheduler = { git = "https://github.com/davletovb/seatline", rev = "0cb105e4c4d753abf8fb305d8ccedeeb64dd0ef4" }
seatline-fake-provider = { git = "https://github.com/davletovb/seatline", rev = "0cb105e4c4d753abf8fb305d8ccedeeb64dd0ef4" }

[workspace.lints.rust]
unsafe_code = "forbid"
